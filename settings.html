<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>导航记忆 · 保存位置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <p class="eyebrow">ChatGPT 问题导航</p>
    <h1>记忆保存位置</h1>
    <p class="intro">把问题目录保存在你选择的文件夹里，下次打开对话时直接恢复。</p>
    <section aria-labelledby="location-title">
      <h2 id="location-title">当前保存位置</h2>
      <p id="location" class="location">正在读取…</p>
      <p id="permission" class="muted"></p>
      <div class="actions">
        <button id="choose" class="primary" type="button">选择保存文件夹</button>
        <button id="authorize" type="button" hidden>重新授权此文件夹</button>
        <button id="browser" type="button">使用浏览器存储</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="how-title">
      <h2 id="how-title">保存到插件所在文件夹</h2>
      <ol>
        <li>点击「选择保存文件夹」。</li>
        <li>在系统窗口中选中你的 <strong>ChatGPT-Navigator</strong> 文件夹，并允许写入。</li>
        <li>记忆会保存到其中的 <code>navigator-data</code> 子文件夹。</li>
      </ol>
      <p class="muted">现有目录会迁移到新位置，写入核验完成后清除浏览器中的旧目录正文。书签继续保留在浏览器中。</p>
    </section>
    <p class="footnote">浏览器会保留文件夹授权及少量设置。若授权失效或文件夹移动，请在这里重新选择或授权。切回浏览器存储时，原文件夹中的 JSON 文件会保留。</p>
  </main>
  <script src="folder-storage.js"></script>
  <script src="settings.js"></script>
</body>
</html>
